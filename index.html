<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dreaming Cradle 위키</title>
  <link rel="icon" href="assets/img/char/pluvia-sd.png">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>

  <!-- 왼쪽 글로벌 내비게이션 -->
  <nav class="gnav" aria-label="글로벌 메뉴">
    <a class="gnav__item" href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>대문</span>
    </a>
    <a class="gnav__item" href="#/characters" data-nav="characters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-7 8-7s7 2.5 8 7"/></svg><span>캐릭터</span>
    </a>
    <a class="gnav__item" href="#/story" data-nav="story">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5zM12 6v13.5"/></svg><span>스토리</span>
    </a>
    <a class="gnav__item" href="#/world" data-nav="world">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.3 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.3-3.5-8.5s1-6 3.5-8.5z"/></svg><span>세계관</span>
    </a>
    <a class="gnav__item" href="#/random" data-nav="random">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2 0 3 1 4.2 2.8l2.6 4.4C14.5 16 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.3-.5 3.1-1.4M14.4 8.4c.8-.9 1.7-1.4 3.1-1.4H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span>랜덤</span>
    </a>
    <button class="gnav__item gnav__item--bottom" type="button" data-nav="top">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14l7-7 7 7M12 7v13"/></svg><span>맨 위로</span>
    </button>
  </nav>

  <!-- 상단 바 -->
  <header class="topbar">
    <a class="topbar__brand" href="#/" aria-label="대문으로"><img src="assets/img/logo.png" alt=""><span>Dreaming Cradle</span></a>
    <form class="search" id="search" role="search" autocomplete="off">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="search-input" type="search" placeholder="검색" aria-label="위키 검색">
      <ul class="search__suggest" id="search-suggest" role="listbox" hidden></ul>
    </form>
    <a class="btn btn--outline" href="#/notes">제작 노트</a>
    <a class="btn btn--solid" href="#/characters">캐릭터 전체 보기</a>
  </header>

  <div class="wrap">
    <!-- 커뮤니티 헤더 -->
    <div class="ch" style="--header-img:url('../img/header.png')">
      <div class="ch__inner">
        <a class="ch__icon" href="#/" aria-label="대문으로"><img src="assets/img/logo.png" alt=""></a>
        <div class="ch__meta">
          <a class="ch__name" href="#/">Dreaming Cradle 위키</a>
          <nav class="lnav" id="lnav" aria-label="위키 메뉴"></nav>
        </div>
        <div class="ch__tools">
          <div class="ch__count"><b id="page-count">0</b><span>문서</span></div>
        </div>
      </div>
    </div>

    <!-- 본문 -->
    <div class="page" id="page">
      <div class="side-tools" aria-label="페이지 도구">
        <button class="side-tool" type="button" data-tool="wide" title="넓게 보기" aria-label="넓게 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="side-tool" type="button" data-tool="toc" title="목차로" aria-label="목차로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
        </button>
        <button class="side-tool" type="button" data-tool="top" title="맨 위로" aria-label="맨 위로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
        </button>
      </div>
      <main class="page__main" id="main" tabindex="-1"></main>
      <aside class="rail" id="rail" aria-label="사이드바"></aside>
    </div>

    <footer class="gfooter">
      <div class="gfooter__inner">
        <div class="gfooter__brand">
          <img src="assets/img/logo.png" alt="Dreaming Cradle">
          <p id="footer-desc"></p>
        </div>
        <div class="gfooter__col"><h3>탐색</h3><ul id="footer-explore"></ul></div>
        <div class="gfooter__col"><h3>캐릭터</h3><ul id="footer-chars"></ul></div>
        <div class="gfooter__col"><h3>작품</h3><ul id="footer-work"></ul></div>
      </div>
      <p class="gfooter__copy" id="footer-copy"></p>
    </footer>
  </div>

  <!-- 이미지 크게 보기 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
    <div class="lightbox__top"><span id="lightbox-title"></span><button class="lightbox__close" type="button" data-close aria-label="닫기">✕</button></div>
    <div class="lightbox__body" data-close><img id="lightbox-img" alt=""></div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
